name: CI

on:
  push:
    branches: [main, kp]
  pull_request:

permissions:
  contents: read

env:
  OMNIXYS_TOKEN: ${{ secrets.OMNIXYS_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate temporary .npmrc (git-ignored, never committed)
        run: node scripts/setup-npmrc.js

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm test:types

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Remove temporary .npmrc
        if: always()
        run: node scripts/setup-npmrc.js --remove
