name: CI

on:
  push:
    branches: [main, kp]
  pull_request:

permissions:
  contents: read

env:
  OMNIXYS_TOKEN: ${{ secrets.OMNIXYS_TOKEN }}
  NODE_ENV: production

  NEXT_PUBLIC_OTEL_ENDPOINT: ${{ vars.NEXT_PUBLIC_OTEL_ENDPOINT }}
  NEXT_PUBLIC_OTEL_SERVICE_NAME:  ${{ vars.NEXT_PUBLIC_OTEL_SERVICE_NAME }}
  NEXT_PUBLIC_OTEL_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_OTEL_SAMPLE_RATE }}
  
  
  NEXT_PUBLIC_BACKEND_SERVER_URL:  ${{ vars.NEXT_PUBLIC_BACKEND_SERVER_URL }}
  NEXT_PUBLIC_GRAPHQL_WS_URL:  ${{ vars.NEXT_PUBLIC_GRAPHQL_WS_URL }}
  
  NEXT_PUBLIC_FALLBACK_URL:  ${{ vars.NEXT_PUBLIC_FALLBACK_URL }}
  NEXT_PUBLIC_CHECKPOINT_BASE_PATH:  ${{ vars.NEXT_PUBLIC_CHECKPOINT_BASE_PATH }}
  
  NEXT_PUBLIC_EVENT_ID: ${{ secrets.NEXT_PUBLIC_EVENT_ID }}
  
  NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
  NEXT_PUBLIC_APP_URL:   ${{ vars.NEXT_PUBLIC_APP_URL }}
  NEXT_PUBLIC_NEXYS_HOME_URL: ${{ vars.NEXT_PUBLIC_NEXYS_HOME_URL }}
  
  NEXT_PUBLIC_EVENT_API: ${{ vars.NEXT_PUBLIC_EVENT_API }}
  NEXT_PUBLIC_INVITATION_API: ${{ vars.NEXT_PUBLIC_INVITATION_API }}
  
  ANALYTICS_CONSENT_SECRET: ${{ secrets.ANALYTICS_CONSENT_SECRET }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate temporary .npmrc (git-ignored, never committed)
        run: node scripts/setup-npmrc.js

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm test:types

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Remove temporary .npmrc
        if: always()
        run: node scripts/setup-npmrc.js --remove
