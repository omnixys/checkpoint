
query Event($id: ID!) {
  event(id: $id) {
    ...EventFull
  }
}

query EventPage($eventId: ID!) {
  event(id: $eventId) {
    id
    name
    myRole
    timeline {
      id
      eventId
      type
      timestamp
      label
    }
    coverMedia {
      id
      url
      variants {
        url
        width
      }
    }
    settings {
      startsAt
      endsAt
    }
  }
}


query GetEventMeta($eventId: ID!) {
  event(id: $eventId) {
    id
    name
    myRole
    coverMedia {
      id
      url
    }
  }
}

query GetEventName($eventId: ID!) {
  event(id: $eventId) {
    name
  }
}



query GetActiveEvent($eventId: ID!) {
  event(id: $eventId) {
    id
    name
    myRole
    settings {
    allowGuestSeatSelection
    }
  }
}



query GetEventSettings($eventId: ID!) {
  event(id: $eventId) {
    id
    name
    myRole
    owner
    parentId
    userRoles {
      role
      userId
    }
    timeline {
      id
      eventId
      type
      timestamp
      label
    }
    coverMedia {
      id
      url
      variants {
        url
        width
      }
    }
    settings {
      id
      allowReEntry
      rotateSeconds
      maxSeats
      dressCode
      description
      isActive
      startsAt
      endsAt
      allowPublicRsvp
      allowPublicPlusOne
      allowPublicRsvpWebsite
      allowPlusOneUpdate
      maxPlusOnes
      requireApprovalForPlusOnes
      rsvpDeadline
      approvalMode
      allowGuestSeatSelection
      allowSeatOverbooking
      isPublic
      publicRsvpWebsite
      category
      createdAt
      updatedAt
    }
  }
}