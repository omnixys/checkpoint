query GetEventTree($eventId: ID!) {
  eventTree(eventId: $eventId) {
    rootEvent {
      id
      name
      settings {
        endsAt
        invitedByOptions
      }
    }
    subEvents {
      id
      name
      parentId
      depth
      settings {
        endsAt
        invitedByOptions
      }
    }
  }
}

