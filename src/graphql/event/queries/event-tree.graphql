query GetFullEventTreeInfo($eventId: ID!) {
  eventTree(eventId: $eventId) {
    rootEvent {
      id
      name
      settings {
        id
        endsAt
        invitedByOptions
        seatColorGroups {
          id
          name
          matchType
          invitedByValues
          priority
          order
          isOrphaned
          style {
            background
            foreground
            border
            legendIcon
          }
        }
      }
    }
    subEvents {
      id
      name
      settings {
        id
        endsAt
        invitedByOptions
        seatColorGroups {
          id
          name
          matchType
          invitedByValues
          priority
          order
          isOrphaned
          style {
            background
            foreground
            border
            legendIcon
          }
        }
      }
    }
  }
}
