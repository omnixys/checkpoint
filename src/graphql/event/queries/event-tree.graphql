query GetEventTree($eventId: ID!) {
  eventTree(eventId: $eventId) {
    rootEvent {
      id
      name
      settings {
        id
        endsAt
        invitedByOptions
      }
    }
    subEvents {
      id
      name
      parentId
      depth
      settings {
        id
        endsAt
        invitedByOptions
      }
    }
  }
}

