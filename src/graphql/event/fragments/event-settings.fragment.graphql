fragment EventSettings on SettingsPayload {
  id
  allowReEntry
  rotateSeconds
  maxSeats
  dressCode
  description
  invitedByOptions
  isActive
  startsAt
  endsAt
  allowPublicRsvp
  allowPublicPlusOne
  allowPublicRsvpWebsite
  allowPlusOneUpdate
  maxPlusOnes
  requireApprovalForPlusOnes
  rsvpDeadline
  approvalMode
  allowGuestSeatSelection
  allowSeatOverbooking
  isPublic
  publicRsvpWebsite
  visibleTabs
  category
  scheduleTicketRelease
  ticketReleaseAt
  guestConfirmationReminderEnabled
  guestConfirmationReminderPresets
  guestConfirmationMaxResends
  createdAt
  updatedAt
  seatColorGroups {
    id
    name
    matchType
    invitedByValues
    priority
    order
    isOrphaned
    style {
      background
      foreground
      border
      legendIcon
    }
  }
}
