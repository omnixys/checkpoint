query UnassignedConversations($eventId: String!) {
  unassignedConversations: supportUnassigned(eventId: $eventId) {
    id
    eventId
    invitationId
    guestUserId
    guestName
    guestContact
    subject
    status
    priority
    channel
    lastMessageAt
    lastMessagePreview
    createdAt
    updatedAt
  }
}
