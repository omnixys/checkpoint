mutation CreateInAppConversation(
  $participantUserId: String!
  $conversationType: ConversationType! = DIRECT
) {
  createInAppConversation(
    participantUserId: $participantUserId
    conversationType: $conversationType
  ) {
    id
    type
    channel
    lastMessage
    lastMessageAt
    unreadCount
    externalAddress
    externalDisplayName
    participants {
      userId
    }
  }
}
