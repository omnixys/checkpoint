mutation CreateInternalConversation(
  $eventId: String!
  $title: String!
  $type: InternalConversationType!
  $description: String
  $participantIds: [String!]
) {
  createInternalConversation(
    eventId: $eventId
    title: $title
    type: $type
    description: $description
    participantIds: $participantIds
  ) {
    id
    eventId
    title
    description
    type
    createdBy
    isActive
    createdAt
    updatedAt
  }
}
