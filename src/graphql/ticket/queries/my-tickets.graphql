# import TicketFull from "../fragments/ticket.fragment.graphql"

query GetMyTickets {
  getMyTickets {
    ...TicketFull
  }
}

query GetMyTicketList {
  getMyTickets {
    id
    eventId
    seatId
  }
}

query GetMyFullTicketList {
  getMyTickets {
    eventId
    seatId

    deviceId
    devicePublicKey
    deviceActivationAt
    currentState
    revoked
    id
    revokedReason
  }
}
