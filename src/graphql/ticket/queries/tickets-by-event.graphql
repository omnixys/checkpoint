# import TicketBasic from "../fragments/ticket-basic.fragment.graphql"

query TicketsByEvent($eventId: ID!) {
  ticketsByEvent(eventId: $eventId) {
    ...TicketBasic
  }
}


query TicketPage($eventId: ID!) {
  ticketsByEvent(eventId: $eventId) {
    id
    seatId
    currentState
    revoked
  }
}

query SecurityTicketPage($eventId: ID!) {
  ticketsByEvent(eventId: $eventId) {
    id
    revoked
    guestProfileId
    seatId
    checkedInAt
    currentState
  }
}

