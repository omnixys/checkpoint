mutation RemoveAllPlusOnesByInvitationId($id: ID!) {
  removeAllPlusOnesByInvitationId(invitedByInvitationId: $id) {
    ...InvitationFull
  }
}

mutation RemoveAllPlusOnes($id: ID!) {
  removeAllPlusOnesByInvitationId(invitedByInvitationId: $id) {
    id
    firstName
    lastName
    email
    status
    plusOneAgeCategory
    phoneNumbers {
      countryCode
      number
      type
      label
      isPrimary
    }
  }
}
