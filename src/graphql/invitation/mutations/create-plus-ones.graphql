# import InvitationFull from "../fragments/invitation.fragment.graphql"

mutation CreatePlusOnesInvitation($input: CreatePlusOneInput!) {
  createPlusOnesInvitation(input: $input) {
    ...InvitationFull
  }
}

mutation AddPlusOne($input: CreatePlusOneInput!) {
  createPlusOnesInvitation(input: $input) {
    id
    firstName
    lastName
    email
    status
    plusOneAgeCategory
    phoneNumbers {
      countryCode
      number
      type
      label
      isPrimary
    }
  }
}
