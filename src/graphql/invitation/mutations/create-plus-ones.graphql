# import InvitationFull from "../fragments/invitation.fragment.graphql"

mutation CreatePlusOnesInvitation($input: CreatePlusOneInput!, $eventEndsAt: DateTime!) {
  createPlusOnesInvitation(input: $input, eventEndsAt: $eventEndsAt) {
    ...InvitationFull
  }
}

mutation AddPlusOne($input: CreatePlusOneInput!, $eventEndsAt: DateTime!) {
  createPlusOnesInvitation(input: $input, eventEndsAt: $eventEndsAt) {
    id
    firstName
    lastName
    email
    status
    phoneNumbers {
      countryCode
      number
      type
      label
      isPrimary
    }
  }
}
