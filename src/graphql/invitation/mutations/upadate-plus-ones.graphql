mutation UpdatePlusOnesInvitation($input: UpdatePlusOneInput!) {
  updatePlusOnesInvitation(input: $input) {
    id
  }
}

mutation UpdatePlusOne($input: UpdatePlusOneInput!) {
  updatePlusOnesInvitation(input: $input) {
    id
    firstName
    lastName
    email
    status
    plusOneAgeCategory
    phoneNumbers {
      countryCode
      number
      type
      label
      isPrimary
    }
  }
}

mutation UpdateInvitationPlusOneLimit($input: UpdateInvitationPlusOneLimitInput!) {
  updateInvitationPlusOneLimit(input: $input) {
    id
    maxInvitees
  }
}
