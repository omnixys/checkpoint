# import InvitationFull from "../fragments/invitation.fragment.graphql"

mutation RemovePlusOneInvitation($id: ID!) {
  removePlusOneInvitation(id: $id) {
    ...InvitationFull
  }
}


mutation RemovePlusOne($id: ID!) {
  removePlusOneInvitation(id: $id) {
    id
    firstName
    lastName
    email
    status
    phoneNumbers {
      countryCode
      number
      type
      label
      isPrimary
    }
  }
}
