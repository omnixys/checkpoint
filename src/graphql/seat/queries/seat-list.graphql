query GetSeatList($seatIdList: [ID!]!) {
  getSeatList(seatIds: $seatIdList) {
    ...SeatBasic
  }
}

query GetSeatInfoList($seatIdList: [ID!]!) {
  getSeatList(seatIds: $seatIdList) {
    id
    label
    number
  }
}

query GetFullSeatInfoList($seatIdList: [ID!]!) {
  getSeatList(seatIds: $seatIdList) {
    id
    label
    number

    section {
      name
      id
    }

    table {
      name
      id
    }
  }
}
