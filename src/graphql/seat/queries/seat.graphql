# import SeatFull from "../fragments/seat.fragment.graphql"

query Seat($seatId: ID!) {
  seat(id: $seatId) {
    ...SeatFull
  }
}

query GetSeatInfo($seatId: ID!) {
  seat(id: $seatId) {
    id
    label
    number
  }
}

query GetFullSeatInfo($seatId: ID!) {
  seat(id: $seatId) {
    id
    label
    number

    section {
      name
      id
    }

    table {
      name
      id
    }
  }
}
