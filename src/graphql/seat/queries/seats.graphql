query Seats($eventId: ID!) {
  seats(eventId: $eventId) {
    ...SeatFull
  }
}

query SeatList($eventId: ID!) {
  seats(eventId: $eventId) {
    id
    eventId
    label
    status
    note
    guestId
    invitationId

    number

    section {
      name
      id
    }

    table {
      name
      id
    }
  }
}
