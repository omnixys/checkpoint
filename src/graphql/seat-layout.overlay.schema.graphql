# Offline gateway compatibility, checked against the Seat GraphQLSchemaFactory SDL.
# Runtime schema comes from the corrected LayoutMutationResolver decorators.
type Mutation {
  moveSection(input: MoveSectionInput!): SectionPayload!
  moveTable(input: MoveTableInput!): TablePayload!
  updateSection(input: UpdateSectionInput!): SectionPayload!
  appendTableSeats(input: AppendTableSeatsInput!): [SeatPayload!]!
}

input AppendTableSeatsInput {
  tableId: ID!
  count: Int!
}

input UpdateSectionInput {
  rotation: Float
}

input UpdateSeatInput {
  width: Float
  height: Float
  shape: SeatShape
}
